name: Quality gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Report toolchain
        run: |
          node --version
          npm --version

      - name: Install locked dependencies
        run: npm ci

      - name: Audit public content
        run: npm run audit:public

      - name: Check Astro and TypeScript
        run: npm run check

      - name: Build static site
        run: npm run build

      - name: Run tests
        run: npm test -- --run
